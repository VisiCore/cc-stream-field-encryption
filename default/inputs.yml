inputs:
  vct_field_encryption_datagen:
    type: datagen
    disabled: false
    sendToRoutes: true
    pqEnabled: false
    streamtags:
      - vct
      - encryption-demo
    samples:
      - eventsPerSec: 1
        sample: business_event
    metadata:
      - name: sourcetype
        value: '"vct:business_event"'
    description: Demo generator for the field-encryption pipeline (ships disabled).
      Replays Cribl's built-in business_event sample, which exists on every
      Worker. Enable it, add a Worker Group route for
      __inputId.includes('vct_field_encryption_datagen'), commit and deploy.
